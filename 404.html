<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

            background:#0B1120;

            color:#ffffff;

            text-align:center;

            padding:20px;

        }

        .error-box{

            max-width:600px;

        }

        h1{

            font-size:6rem;

            color:#3B82F6;

            margin-bottom:20px;

        }

        h2{

            margin-bottom:15px;

        }

        p{

            color:#cbd5e1;

            margin-bottom:35px;

            line-height:1.8;

        }

        a{

            display:inline-block;

            padding:15px 30px;

            border-radius:50px;

            background:#3B82F6;

            color:#fff;

            text-decoration:none;

            transition:.3s;

        }

        a:hover{

            opacity:.9;

            transform:translateY(-3px);

        }

    </style>

</head>

<body>

    <div class="error-box">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>

            Sorry, the page you are looking for
            does not exist or has been moved.

        </p>

        <a href="index.html">

            Back to Home

        </a>

    </div>

</body>

</html>

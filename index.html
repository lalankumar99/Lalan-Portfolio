<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         BASIC META
    =========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge">

    <!-- ==========================================
         SEO
    =========================================== -->

    <title>Lalan Kumar | Premium Portfolio</title>

    <meta
        name="description"
        content="Official Premium Portfolio of Lalan Kumar">

    <meta
        name="keywords"
        content="Lalan Kumar, Portfolio, Web Developer, Electrical Engineering, AI">

    <meta
        name="author"
        content="Lalan Kumar">

    <meta
        name="robots"
        content="index, follow">

    <!-- ==========================================
         THEME
    =========================================== -->

    <meta
        name="theme-color"
        content="#0B1120">

    <!-- ==========================================
         OPEN GRAPH
    =========================================== -->

    <meta
        property="og:title"
        content="Lalan Kumar | Premium Portfolio">

    <meta
        property="og:description"
        content="Official Premium Portfolio Website">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:image"
        content="assets/images/preview.jpg">

    <!-- ==========================================
         PWA
    =========================================== -->

    <link
        rel="manifest"
        href="manifest.json">

    <!-- ==========================================
         ICONS
    =========================================== -->

    <link
        rel="icon"
        href="assets/icons/favicon.ico">

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png">

    <!-- ==========================================
         GOOGLE FONTS
    =========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="libs/fontawesome/css/all.min.css">

    <!-- ==========================================
         CSS FILES
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
         rel="stylesheet" 
         href="css/header.css">

    <link
        rel="stylesheet"
        href="css/responsive.css">

    <link
        rel="stylesheet"
        href="css/animation.css">

    <link
        rel="stylesheet"
        href="css/about.css">

    <link
        rel="stylesheet"
        href="css/skills.css">

    <link
        rel="stylesheet"
        href="css/experience.css">

    <link
        rel="stylesheet"
        href="css/projects.css">

    <link
        rel="stylesheet"
        href="css/gallery.css">

    <link
        rel="stylesheet"
        href="css/certificates.css">

    <link
        rel="stylesheet"
        href="css/resume.css">

    <link
        rel="stylesheet"
        href="css/blog.css">

    <link
        rel="stylesheet"
        href="css/dashboard.css">

    <link
        rel="stylesheet"
        href="css/contact.css">

    <link
        rel="stylesheet"
        href="css/footer.css">

</head>

<body>
    <!-- ==========================================
         LOADER
    =========================================== -->

    <div id="loader"></div>

    <!-- ==========================================
         SCROLL PROGRESS
    =========================================== -->

    <div id="scroll-progress"></div>

    <!-- ==========================================
         CUSTOM CURSOR
    =========================================== -->

    <div id="cursor"></div>

    <!-- ==========================================
         PARTICLE BACKGROUND
    =========================================== -->

    <canvas id="particles"></canvas>

    <!-- ==========================================
         HEADER (Loaded by app.js)
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         SIDEBAR (Loaded by app.js)
    =========================================== -->

    <div id="sidebar"></div>

    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main id="main-content">

        <div id="hero"></div>

        <div id="about"></div>

        <div id="skills"></div>

        <div id="education"></div>

        <div id="experience"></div>

        <div id="projects"></div>

        <div id="gallery"></div>

        <div id="certificates"></div>

        <div id="resume"></div>

        <div id="blog"></div>

        <div id="dashboard"></div>

        <div id="contact"></div>

    </main>

    <!-- ==========================================
         FOOTER (Loaded by app.js)
    =========================================== -->

    <div id="footer"></div>

    <!-- ==========================================
         BACK TO TOP BUTTON
    =========================================== -->

    <button
        id="backToTop"
        class="back-top"
        aria-label="Back to Top">

        <i class="fas fa-arrow-up"></i>

    </button>
    <!-- ==========================================
         JAVASCRIPT FILES
    =========================================== -->

    <script src="js/app.js"></script>

    <script src="js/navbar.js"></script>

    <script src="js/theme.js"></script>

    <script src="js/search.js"></script>

    <script src="js/gallery.js"></script>

    <script src="js/pdf-viewer.js"></script>

    <script src="js/scroll.js"></script>

    <script src="js/typing.js"></script>

    <script src="js/particles.js"></script>

    <script src="js/filter.js"></script>

    <script src="js/main.js"></script>

    <!-- ==========================================
         SERVICE WORKER
    =========================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(() => {

                        console.log("Service Worker Registered");

                    })
                    .catch(error => {

                        console.error(
                            "Service Worker Error:",
                            error
                        );

                    });

            });

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         BASIC META
    =========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge">

    <!-- ==========================================
         SEO
    =========================================== -->

    <title>Lalan Kumar | Premium Portfolio</title>

    <meta
        name="description"
        content="Official Premium Portfolio of Lalan Kumar">

    <meta
        name="keywords"
        content="Lalan Kumar, Portfolio, Web Developer, Electrical Engineering, AI">

    <meta
        name="author"
        content="Lalan Kumar">

    <meta
        name="robots"
        content="index, follow">

    <!-- ==========================================
         THEME
    =========================================== -->

    <meta
        name="theme-color"
        content="#0B1120">

    <!-- ==========================================
         OPEN GRAPH
    =========================================== -->

    <meta
        property="og:title"
        content="Lalan Kumar | Premium Portfolio">

    <meta
        property="og:description"
        content="Official Premium Portfolio Website">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:image"
        content="assets/images/preview.jpg">

    <!-- ==========================================
         PWA
    =========================================== -->

    <link
        rel="manifest"
        href="manifest.json">

    <!-- ==========================================
         ICONS
    =========================================== -->

    <link
        rel="icon"
        href="assets/icons/favicon.ico">

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png">

    <!-- ==========================================
         GOOGLE FONTS
    =========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         MAIN CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/style.css">

    <!-- ==========================================
         COMPONENT / SECTION CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/header.css">

    <link
        rel="stylesheet"
        href="css/about.css">

    <link
        rel="stylesheet"
        href="css/skills.css">

    <link
        rel="stylesheet"
        href="css/experience.css">

    <link
        rel="stylesheet"
        href="css/projects.css">

    <link
        rel="stylesheet"
        href="css/gallery.css">

    <link
        rel="stylesheet"
        href="css/certificates.css">

    <link
        rel="stylesheet"
        href="css/resume.css">

    <link
        rel="stylesheet"
        href="css/blog.css">

    <link
        rel="stylesheet"
        href="css/dashboard.css">

    <link
        rel="stylesheet"
        href="css/contact.css">

</head>


<body>

    <!-- ==========================================
         PAGE LOADER
    =========================================== -->

    <div id="loader"></div>


    <!-- ==========================================
         SCROLL PROGRESS
    =========================================== -->

    <div id="scroll-progress"></div>


    <!-- ==========================================
         CUSTOM CURSOR
    =========================================== -->

    <div id="cursor"></div>


    <!-- ==========================================
         PARTICLE BACKGROUND
    =========================================== -->

    <canvas id="particles"></canvas>


    <!-- ==========================================
         HEADER
         Loaded by app.js
    =========================================== -->

    <div id="header"></div>


    <!-- ==========================================
         SIDEBAR
         Loaded by app.js
    =========================================== -->

    <div id="sidebar"></div>


    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main id="main-content">

        <!-- HERO -->
        <div id="hero"></div>

        <!-- ABOUT -->
        <div id="about"></div>

        <!-- SKILLS -->
        <div id="skills"></div>

        <!-- EDUCATION -->
        <div id="education"></div>

        <!-- EXPERIENCE -->
        <div id="experience"></div>

        <!-- PROJECTS -->
        <div id="projects"></div>

        <!-- GALLERY -->
        <div id="gallery"></div>

        <!-- CERTIFICATES -->
        <div id="certificates"></div>

        <!-- RESUME -->
        <div id="resume"></div>

        <!-- BLOG -->
        <div id="blog"></div>

        <!-- DASHBOARD -->
        <div id="dashboard"></div>

        <!-- CONTACT -->
        <div id="contact"></div>

    </main>


    <!-- ==========================================
         FOOTER
         Loaded by app.js
    =========================================== -->

    <div id="footer"></div>


    <!-- ==========================================
         BACK TO TOP
    =========================================== -->

    <button
        id="backToTop"
        class="back-top"
        type="button"
        aria-label="Back to Top">

        <i class="fas fa-arrow-up"></i>

    </button>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <!-- Main Application -->
    <script src="js/app.js"></script>

    <!-- Navigation -->
    <script src="js/navbar.js"></script>

    <!-- Theme -->
    <script src="js/theme.js"></script>

    <!-- Scroll -->
    <script src="js/scroll.js"></script>


    <!-- ==========================================
         SERVICE WORKER
    =========================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(function () {

                        console.log(
                            "Service Worker Registered Successfully"
                        );

                    })
                    .catch(function (error) {

                        console.error(
                            "Service Worker Registration Failed:",
                            error
                        );

                    });

            });

        }

    </script>

</body>

                               </html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Offline | Lalan Kumar</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

            background:#0B1120;

            color:#fff;

            text-align:center;

            padding:20px;

        }

        .offline{

            max-width:500px;

        }

        h1{

            font-size:3rem;

            margin-bottom:20px;

        }

        p{

            color:#cbd5e1;

            margin-bottom:30px;

            line-height:1.8;

        }

        button{

            padding:15px 30px;

            border:none;

            border-radius:50px;

            cursor:pointer;

            background:#3B82F6;

            color:#fff;

            font-size:16px;

        }

    </style>

</head>

<body>

    <div class="offline">

        <h1>📡 Offline</h1>

        <p>

            You're currently offline.

            Please check your internet connection
            and try again.

        </p>

        <button onclick="location.reload()">

            Retry

        </button>

    </div>

</body>

</html>

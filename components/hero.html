<!-- ==========================================
     LALAN KUMAR - PREMIUM HERO
========================================== -->

<style>

    /* ==========================================
       HERO SECTION
    ========================================== */

    .hero {

        min-height: 100vh;

        width: 100%;

        display: grid;

        grid-template-columns:
            1.15fr 0.85fr;

        align-items: center;

        gap: 60px;

        padding:
            150px 5% 100px;

        position: relative;

        overflow: hidden;

    }


    /* ==========================================
       HERO LEFT
    ========================================== */

    .hero-left {

        max-width: 700px;

        position: relative;

        z-index: 2;

    }


    /* ==========================================
       WELCOME BADGE
    ========================================== */

    .badge {

        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding:
            8px 16px;

        margin-bottom: 22px;

        border:
            1px solid
            rgba(59,130,246,0.30);

        border-radius: 50px;

        background:
            rgba(59,130,246,0.08);

        color:
            var(--secondary);

        font-size:
            0.85rem;

        font-weight:
            500;

    }


    /* ==========================================
       HERO TITLE
    ========================================== */

    .hero h1 {

        margin: 0;

        font-size:
            clamp(2.5rem, 6vw, 5rem);

        line-height:
            1.1;

        font-weight:
            800;

        letter-spacing:
            -1px;

        color:
            var(--text);

    }


    .hero h1 .gradient {

        display: inline-block;

    }


    /* ==========================================
       TYPING TITLE
    ========================================== */

    .hero h2 {

        margin-top:
            18px;

        color:
            var(--secondary);

        font-size:
            clamp(1.2rem, 2.5vw, 1.8rem);

        font-weight:
            600;

    }


    /* ==========================================
       HERO DESCRIPTION
    ========================================== */

    .hero p {

        max-width:
            650px;

        margin-top:
            20px;

        color:
            var(--text-light);

        font-size:
            1rem;

        line-height:
            1.8;

    }


    /* ==========================================
       HERO BUTTONS
    ========================================== */

    .hero-buttons {

        display:
            flex;

        flex-wrap:
            wrap;

        align-items:
            center;

        gap:
            14px;

        margin-top:
            30px;

    }


    /* ==========================================
       HERO SOCIAL
    ========================================== */

    .hero-social {

        display:
            flex;

        flex-wrap:
            wrap;

        gap:
            18px;

        margin-top:
            28px;

        color:
            var(--text-light);

        font-size:
            0.9rem;

    }


    .hero-social span,
    .hero-social a {

        transition:
            color 0.3s ease,
            transform 0.3s ease;

    }


    .hero-social a:hover {

        color:
            var(--primary);

        transform:
            translateY(-2px);

    }


    /* ==========================================
       HERO RIGHT
    ========================================== */

    .hero-right {

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        position:
            relative;

        z-index:
            2;

    }


    /* ==========================================
       PROFILE IMAGE
    ========================================== */

    .hero-right img {

        width:
            min(420px, 80vw);

        aspect-ratio:
            1 / 1;

        object-fit:
            cover;

        border-radius:
            50%;

        border:
            4px solid
            var(--primary);

        box-shadow:
            0 0 0 12px
            rgba(59,130,246,0.06),
            0 25px 70px
            rgba(0,0,0,0.35);

        animation:
            heroFloat 5s ease-in-out infinite;

    }


    /* ==========================================
       FLOATING ANIMATION
    ========================================== */

    @keyframes heroFloat {

        0%,
        100% {

            transform:
                translateY(0);

        }

        50% {

            transform:
                translateY(-12px);

        }

    }


    /* ==========================================
       BACKGROUND GLOW
    ========================================== */

    .hero::before {

        content: "";

        position:
            absolute;

        width:
            420px;

        height:
            420px;

        top:
            15%;

        right:
            -180px;

        border-radius:
            50%;

        background:
            rgba(59,130,246,0.12);

        filter:
            blur(80px);

        pointer-events:
            none;

    }


    .hero::after {

        content: "";

        position:
            absolute;

        width:
            350px;

        height:
            350px;

        bottom:
            -180px;

        left:
            -120px;

        border-radius:
            50%;

        background:
            rgba(139,92,246,0.10);

        filter:
            blur(80px);

        pointer-events:
            none;

    }


    /* ==========================================
       LIGHT THEME
    ========================================== */

    body.light-theme .hero {

        background:
            transparent;

    }


    /* ==========================================
       TABLET
    ========================================== */

    @media (max-width: 992px) {

        .hero {

            grid-template-columns:
                1fr;

            text-align:
                center;

            gap:
                45px;

            padding:
                140px 6% 80px;

        }


        .hero-left {

            max-width:
                800px;

            margin:
                0 auto;

        }


        .hero p {

            margin-left:
                auto;

            margin-right:
                auto;

        }


        .hero-buttons,
        .hero-social {

            justify-content:
                center;

        }


        .hero-right {

            order:
                -1;

        }


        .hero-right img {

            width:
                min(320px, 70vw);

        }

    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 768px) {

        .hero {

            min-height:
                auto;

            padding:
                125px 5% 70px;

            gap:
                35px;

        }


        .hero h1 {

            font-size:
                clamp(2.2rem, 11vw, 3.5rem);

        }


        .hero h2 {

            font-size:
                1.15rem;

        }


        .hero p {

            font-size:
                0.92rem;

            line-height:
                1.7;

        }


        .hero-right img {

            width:
                min(270px, 68vw);

        }


        .hero-buttons {

            flex-direction:
                column;

            width:
                100%;

        }


        .hero-buttons a {

            width:
                min(100%, 280px);

        }

    }


    /* ==========================================
       SMALL MOBILE
    ========================================== */

    @media (max-width: 480px) {

        .hero {

            padding:
                110px 5% 60px;

        }


        .badge {

            font-size:
                0.75rem;

            padding:
                7px 12px;

        }


        .hero-right img {

            width:
                220px;

        }


        .hero-social {

            gap:
                12px;

            font-size:
                0.82rem;

        }

    }


    /* ==========================================
       REDUCED MOTION
    ========================================== */

    @media (prefers-reduced-motion: reduce) {

        .hero-right img {

            animation:
                none;

        }

    }

</style>

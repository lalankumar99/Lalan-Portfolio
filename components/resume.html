<!-- =========================================
     RESUME SECTION
========================================= -->

<section id="resume" class="resume section">

    <div class="container">

        <!-- Section Title -->

        <div class="section-title">

            <span>RESUME</span>

            <h2>My Resume</h2>

            <p>
                View, download, print and share my latest professional resume.
            </p>

        </div>

        <!-- Resume Card -->

        <div class="resume-card glass">

            <!-- Toolbar -->

            <div class="resume-toolbar">

                <button id="zoomOutBtn" class="icon-btn">
                    <i class="fas fa-search-minus"></i>
                </button>

                <button id="zoomInBtn" class="icon-btn">
                    <i class="fas fa-search-plus"></i>
                </button>

                <button id="prevPageBtn" class="icon-btn">
                    <i class="fas fa-chevron-left"></i>
                </button>

                <span class="page-info">
                    Page
                    <span id="currentPage">1</span>
                    /
                    <span id="totalPages">1</span>
                </span>

                <button id="nextPageBtn" class="icon-btn">
                    <i class="fas fa-chevron-right"></i>
                </button>

            </div>

            <!-- PDF Viewer -->

            <div class="resume-viewer">

                <canvas id="resumeCanvas"></canvas>

            </div>

            <!-- Action Buttons -->

            <div class="resume-actions">

                <a
                    href="assets/pdf/resume.pdf"
                    target="_blank"
                    class="btn-primary">

                    View Full Resume

                </a>

                <a
                    href="assets/pdf/resume.pdf"
                    download
                    class="btn-secondary">

                    Download PDF

                </a>

                <button
                    id="printResume"
                    class="btn-secondary">

                    Print Resume

                </button>

                <button
                    id="shareResume"
                    class="btn-secondary">

                    Share

                </button>

            </div>

            <!-- Information -->

            <div class="resume-info">

                <div class="glass">

                    <h4>File Format</h4>

                    <p>PDF</p>

                </div>

                <div class="glass">

                    <h4>Version</h4>

                    <p>1.0</p>

                </div>

                <div class="glass">

                    <h4>Last Updated</h4>

                    <p>August 2026</p>

                </div>

                <div class="glass">

                    <h4>Language</h4>

                    <p>English</p>

                </div>

            </div>

        </div>

    </div>

</section>

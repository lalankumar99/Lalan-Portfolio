<section id="blog" class="blog section">

    <div class="container">

        <!-- Section Title -->

        <div class="section-title">

            <span>BLOG</span>

            <h2>Latest Articles</h2>

            <p>
                Tutorials, engineering notes, web development,
                AI, technology and personal learning experiences.
            </p>

        </div>

        <!-- Search -->

        <div class="blog-search">

            <input
                type="search"
                placeholder="Search articles...">

        </div>

        <!-- Categories -->

        <div class="blog-categories">

            <button class="blog-btn active">All</button>

            <button class="blog-btn">Engineering</button>

            <button class="blog-btn">Programming</button>

            <button class="blog-btn">AI</button>

            <button class="blog-btn">Technology</button>

        </div>

        <!-- Blog Grid -->

        <div class="blog-grid">

            <!-- Article -->

            <article class="blog-card glass">

                <img
                    src="assets/images/blog/blog-1.jpg"
                    alt="Blog">

                <div class="blog-content">

                    <span class="blog-date">
                        August 2026
                    </span>

                    <h3>
                        Building a Premium Portfolio Website
                    </h3>

                    <p>
                        Learn how to create a modern,
                        responsive and professional portfolio.
                    </p>

                    <div class="blog-footer">

                        <span>
                            <i class="fas fa-clock"></i>
                            5 min
                        </span>

                        <span>
                            <i class="fas fa-eye"></i>
                            120
                        </span>

                    </div>

                    <a
                        href="#"
                        class="btn-primary">

                        Read More

                    </a>

                </div>

            </article>

            <!-- Duplicate for More Articles -->

        </div>

    </div>

</section>

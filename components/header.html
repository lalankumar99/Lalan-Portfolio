========================================== -->

<header class="header" id="header">

    <div class="container">

        <div class="header-wrapper">

            <!-- ==========================
                 LOGO
            =========================== -->

            <a href="#hero" class="logo">

                <img
                    src="assets/images/logo.png"
                    alt="Lalan Kumar Logo"
                    class="logo-img">

                <div class="logo-content">

                    <h2>Lalan Kumar</h2>

                    <span>Premium Portfolio</span>

            <!-- ==========================

                    <li>

                    </li>

                    <li>

                    <li>
                        <a href="#skills">

                    </li>

                    <li>
                        <a href="#projects">

                        </a>
                    </li>

                    <li>

                            Gallery
                        </a>
                    </li>

                    <li>
                        <a href="#contact">

                        </a>
                    </li>

                </ul>

            </nav>

                 RIGHT ACTIONS
            =========================== -->

            <div class="header-actions">

                <!-- Theme -->

                <button
                    id="themeToggle"
                    class="icon-btn"
                    aria-label="Theme">

                    <i class="fas fa-moon"></i>

                </button>

                <a

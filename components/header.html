<!-- ==========================================
     LALAN KUMAR - PREMIUM HEADER
========================================== -->

<header
    class="header"
    id="header">

    <div class="container">

        <div class="header-wrapper">

            <!-- ==========================================
                 LOGO
            =========================================== -->

            <a
                href="#hero"
                class="logo"
                aria-label="Lalan Kumar Home">

                <img
                    src="assets/images/logo.png"
                    alt="Lalan Kumar Logo"
                    class="logo-img">

                <div class="logo-content">

                    <h2>Lalan Kumar</h2>

                    <span>
                        Premium Portfolio
                    </span>

                </div>

            </a>


            <!-- ==========================================
                 DESKTOP NAVIGATION
            =========================================== -->

            <nav
                class="desktop-nav"
                aria-label="Main Navigation">

                <ul>

                    <li>
                        <a
                            href="#hero"
                            class="active">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="#about">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="#skills">
                            Skills
                        </a>
                    </li>

                    <li>
                        <a href="#projects">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="#gallery">
                            Gallery
                        </a>
                    </li>

                    <li>
                        <a href="#contact">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>


            <!-- ==========================================
                 HEADER ACTIONS
            =========================================== -->

            <div class="header-actions">

                <!-- Theme Toggle -->

                <button
                    type="button"
                    id="themeToggle"
                    class="icon-btn"
                    aria-label="Toggle Theme"
                    aria-pressed="false">

                    <i
                        class="fas fa-moon"
                        aria-hidden="true">
                    </i>

                </button>


                <!-- Resume -->

                <a
                    href="#resume"
                    class="resume-btn">

                    Resume

                </a>


                <!-- Mobile Menu -->

                <button
                    type="button"
                    id="menuBtn"
                    class="menu-btn"
                    aria-label="Open Navigation Menu"
                    aria-expanded="false"
                    aria-controls="sidebar">

                    <span></span>
                    <span></span>
                    <span></span>

                </button>

            </div>

        </div>

    </div>

     </header>

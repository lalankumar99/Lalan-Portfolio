<!-- ==========================================
     LALAN KUMAR - PREMIUM SIDEBAR
========================================== -->

<style>

    /* ==========================================
       SIDEBAR
    ========================================== */

    .sidebar {

        position: fixed;

        top: 0;
        left: 0;

        width: 280px;
        height: 100vh;

        padding: 100px 20px 25px;

        background: rgba(18, 26, 47, 0.96);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        border-right: 1px solid rgba(255,255,255,0.08);

        box-shadow:
            10px 0 40px rgba(0,0,0,0.25);

        overflow-y: auto;
        overflow-x: hidden;

        z-index: 9990;

        transform: translateX(-100%);

        transition:
            transform 0.35s ease,
            background 0.35s ease;

    }


    /* ==========================================
       SIDEBAR ACTIVE
    ========================================== */

    .sidebar.active {

        transform: translateX(0);

    }


    /* ==========================================
       SIDEBAR SCROLLBAR
    ========================================== */

    .sidebar::-webkit-scrollbar {

        width: 5px;

    }

    .sidebar::-webkit-scrollbar-thumb {

        background: var(--primary);

        border-radius: 20px;

    }


    /* ==========================================
       SIDEBAR HEADER
    ========================================== */

    .sidebar-header {

        text-align: center;

        margin-bottom: 25px;

    }


    .sidebar-profile {

        width: 82px;
        height: 82px;

        margin: 0 auto 12px;

        border-radius: 50%;

        object-fit: cover;

        border: 3px solid var(--primary);

        box-shadow:
            0 0 25px rgba(59,130,246,0.25);

    }


    .sidebar-header h3 {

        margin: 0;

        color: var(--text);

        font-size: 1.15rem;

        font-weight: 700;

    }


    .sidebar-header p {

        margin-top: 4px;

        color: var(--text-light);

        font-size: 0.78rem;

    }


    /* ==========================================
       SIDEBAR NAVIGATION
    ========================================== */

    .sidebar-nav ul {

        list-style: none;

        padding: 0;
        margin: 0;

    }


    .sidebar-nav li {

        margin-bottom: 6px;

    }


    .sidebar-nav a {

        display: flex;

        align-items: center;

        gap: 14px;

        padding: 12px 14px;

        border-radius: 12px;

        color: var(--text-light);

        font-size: 0.9rem;

        font-weight: 500;

        transition:
            background 0.3s ease,
            color 0.3s ease,
            transform 0.3s ease;

    }


    .sidebar-nav a i {

        width: 22px;

        text-align: center;

        color: var(--primary);

        font-size: 1rem;

    }


    .sidebar-nav a:hover {

        color: #FFFFFF;

        background:
            rgba(59,130,246,0.12);

        transform:
            translateX(4px);

    }


    .sidebar-nav a:hover i {

        color:
            var(--secondary);

    }


    /* ==========================================
       QUICK STATS
    ========================================== */

    .sidebar-stats {

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 8px;

        padding: 12px;

        margin-top: 25px;

    }


    .sidebar-stats .stat {

        text-align: center;

        padding: 8px 3px;

    }


    .sidebar-stats h4 {

        color:
            var(--text-light);

        font-size:
            0.65rem;

        font-weight:
            500;

    }


    .sidebar-stats span {

        display: block;

        margin-top: 3px;

        color:
            var(--primary);

        font-size:
            0.85rem;

        font-weight:
            700;

    }


    /* ==========================================
       SOCIAL LINKS
    ========================================== */

    .sidebar-social {

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        margin-top: 25px;

    }


    .sidebar-social a {

        width: 36px;
        height: 36px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 50%;

        color:
            var(--text-light);

        background:
            rgba(255,255,255,0.06);

        transition:
            transform 0.3s ease,
            background 0.3s ease,
            color 0.3s ease;

    }


    .sidebar-social a:hover {

        color:
            #FFFFFF;

        background:
            var(--primary);

        transform:
            translateY(-3px);

    }


    /* ==========================================
       SIDEBAR BOTTOM
    ========================================== */

    .sidebar-bottom {

        display: flex;

        gap: 8px;

        margin-top: 25px;

    }


    .sidebar-btn {

        flex: 1;

        min-height: 42px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 7px;

        padding: 8px;

        border: 1px solid
            rgba(255,255,255,0.08);

        border-radius: 10px;

        cursor: pointer;

        color:
            var(--text-light);

        background:
            rgba(255,255,255,0.05);

        transition:
            background 0.3s ease,
            color 0.3s ease,
            transform 0.3s ease;

    }


    .sidebar-btn:hover {

        color:
            #FFFFFF;

        background:
            var(--primary);

        transform:
            translateY(-2px);

    }


    .sidebar-btn i {

        font-size:
            0.9rem;

    }


    .sidebar-btn span {

        font-size:
            0.75rem;

    }


    /* ==========================================
       LIGHT THEME
    ========================================== */

    body.light-theme .sidebar {

        background:
            rgba(255,255,255,0.95);

        border-right-color:
            rgba(17,24,39,0.10);

        box-shadow:
            10px 0 40px
            rgba(15,23,42,0.12);

    }


    body.light-theme .sidebar-nav a:hover {

        color:
            var(--text);

    }


    body.light-theme .sidebar-social a {

        background:
            rgba(17,24,39,0.06);

        color:
            var(--text-light);

    }


    body.light-theme .sidebar-btn {

        background:
            rgba(17,24,39,0.05);

        border-color:
            rgba(17,24,39,0.08);

    }


    /* ==========================================
       TABLET / MOBILE
    ========================================== */

    @media (max-width: 992px) {

        .sidebar {

            width: 290px;

        }

    }


    /* ==========================================
       SMALL MOBILE
    ========================================== */

    @media (max-width: 480px) {

        .sidebar {

            width: 85vw;
            max-width: 290px;

            padding:
                90px 16px 20px;

        }


        .sidebar-profile {

            width: 72px;
            height: 72px;

        }


        .sidebar-nav a {

            padding:
                11px 12px;

        }

    }

</style>

<!-- =========================================
     CERTIFICATES SECTION
========================================= -->

<section id="certificates" class="certificates section">

    <div class="container">

        <!-- Section Title -->

        <div class="section-title">

            <span>CERTIFICATES</span>

            <h2>My Certifications</h2>

            <p>
                Professional certificates, online courses,
                workshops and achievements.
            </p>

        </div>

        <!-- Filter -->

        <div class="certificate-filter">

            <button class="certificate-btn active">All</button>

            <button class="certificate-btn">AI</button>

            <button class="certificate-btn">Programming</button>

            <button class="certificate-btn">Engineering</button>

            <button class="certificate-btn">Workshops</button>

        </div>

        <!-- Certificate Grid -->

        <div class="certificate-grid">

            <!-- Certificate Card -->

            <div class="certificate-card glass">

                <img
                    src="assets/images/certificates/certificate-1.jpg"
                    alt="Certificate">

                <div class="certificate-content">

                    <h3>Web Development Certificate</h3>

                    <p>
                        Issued by XYZ Organization
                    </p>

                    <span>Issued: January 2026</span>

                    <div class="certificate-buttons">

                        <a
                            href="assets/pdf/certificate-1.pdf"
                            class="btn-primary"
                            target="_blank">

                            View PDF

                        </a>

                        <a
                            href="assets/pdf/certificate-1.pdf"
                            download
                            class="btn-secondary">

                            Download

                        </a>

                    </div>

                </div>

            </div>

            <!-- Duplicate for More Certificates -->

        </div>

    </div>

</section>
